# Release pipeline (§21): tag v* -> wheel with embedded SPA -> PyPI via
# Trusted Publishing (OIDC, no long-lived tokens) -> multi-arch image on GHCR
# -> GitHub Release with artifacts.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write # PyPI Trusted Publishing
  packages: write # GHCR

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: corepack enable
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: build frontend + wheel
        run: |
          uv pip install --system -e ./backend
          python scripts/build_frontend_into_wheel.py
          uv build backend --wheel --sdist -o dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  pypi:
    needs: [build]
    runs-on: ubuntu-latest
    environment: pypi
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  docker:
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}

  github-release:
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          make_latest: true
